<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>300일</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
:root{--bg1:#241757;--bg2:#04020d;--text:#ffe6ee;--hint:#cdb6e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg1:#241757;--bg2:#04020d;--text:#ffe6ee;--hint:#cdb6e6}}
:root[data-theme="dark"]{--bg1:#241757;--bg2:#04020d;--text:#ffe6ee;--hint:#cdb6e6}
html,body{height:100%;margin:0;overflow:hidden;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(100% 50% at 50% 108%,#7a2f78 0%,rgba(122,47,120,0) 70%),linear-gradient(180deg,var(--bg2) 0%,var(--bg1) 100%);color:var(--text);font-family:'Nanum Pen Script','Apple SD Gothic Neo','Malgun Gothic',cursive}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:1}
#scene{position:fixed;left:0;bottom:0;width:100%;height:48vh;z-index:0;pointer-events:none}
.petal{position:fixed;top:0;z-index:2;pointer-events:none;width:var(--s);height:calc(var(--s) * .75);background:#ffc2d6;border-radius:150% 0 150% 0;opacity:.85;animation:petal linear infinite}
@keyframes petal{from{transform:translate(0,-8vh) rotate(0)}50%{transform:translate(40px,55vh) rotate(200deg)}to{transform:translate(-30px,112vh) rotate(420deg)}}
#letter{position:fixed;left:0;right:0;bottom:0;padding:0 28px calc(44px + env(safe-area-inset-bottom,0px));text-align:center;font-size:clamp(26px,6.4vw,38px);line-height:1.4;pointer-events:none;word-break:keep-all;z-index:3;text-shadow:0 0 12px rgba(10,4,30,.9),0 0 3px rgba(10,4,30,.8)}
#letter .w{display:inline-block}
#letter .c{display:inline-block;opacity:0;clip-path:inset(0 100% 0 0);filter:blur(2px);transform:translateY(2px);animation:ink .5s cubic-bezier(.3,.7,.3,1) forwards;animation-delay:calc(var(--i)*110ms)}
#letter.out .c{animation:fade .7s ease both;animation-delay:calc(var(--i)*45ms)}
@keyframes ink{60%{opacity:1;filter:blur(.5px)}100%{opacity:1;clip-path:inset(0 0 0 0);filter:blur(0);transform:none}}
@keyframes fade{from{opacity:1;clip-path:inset(0 0 0 0);filter:blur(0)}to{opacity:0;clip-path:inset(0 0 0 0);filter:blur(2px)}}
#hint{position:fixed;left:0;right:0;top:calc(28px + env(safe-area-inset-top,0px));z-index:3;text-align:center;font-size:24px;color:var(--hint);transition:opacity .8s}
#wall{position:fixed;inset:0;z-index:2;opacity:0;pointer-events:none;transition:opacity 1s ease;background:radial-gradient(90% 70% at 50% 40%,rgba(255,196,120,.22),rgba(30,14,40,0) 70%),rgba(24,10,34,.78);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);overflow:hidden}
#wall.on{opacity:1;pointer-events:auto}
#strings{position:absolute;left:0;top:0}
#again{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:16px;z-index:5;border:1px solid rgba(255,230,238,.5);background:rgba(255,255,255,.08);color:var(--text);border-radius:999px;padding:6px 14px;font:inherit;font-size:20px;cursor:pointer}
.bulb{position:absolute;width:7px;height:7px;margin:-3px 0 0 -3px;border-radius:50%;background:#ffeab0;box-shadow:0 0 8px 3px rgba(255,208,120,.85);animation:tw 2.6s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.5}to{opacity:1}}
.pic{position:absolute;opacity:0;transform:translate(-50%,0)}
#wall.on .pic{animation:drop .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d)}
@keyframes drop{from{opacity:0;transform:translate(-50%,-16px)}to{opacity:1;transform:translate(-50%,0)}}
.in{position:relative;transform-origin:50% 0;transform:rotate(var(--r));animation:sway 4.5s ease-in-out infinite alternate;animation-delay:var(--d)}
@keyframes sway{from{transform:rotate(calc(var(--r) - 1.6deg))}to{transform:rotate(calc(var(--r) + 1.6deg))}}
.in::before{content:'';position:absolute;top:-10px;left:50%;width:9px;height:20px;margin-left:-4.5px;border-radius:2px;background:linear-gradient(#f4dfb8,#d9b87d);box-shadow:0 0 6px rgba(255,214,140,.7);z-index:2}
.frm{background:#fffaf5;padding:5px 5px 16px;border-radius:2px;box-shadow:0 6px 14px rgba(0,0,0,.45),0 0 18px rgba(255,214,140,.25)}
.img{display:flex;align-items:center;justify-content:center;aspect-ratio:1/1.12;background-size:cover;background-position:center;color:rgba(255,255,255,.95);font-size:22px;text-align:center}

.pic{cursor:pointer}
#mute{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:16px;z-index:6;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,230,238,.45);background:rgba(255,255,255,.08);font-size:18px;line-height:1;cursor:pointer;padding:0}
#env{position:absolute;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:5;border:1px solid rgba(255,214,140,.7);background:rgba(255,214,140,.14);color:var(--text);border-radius:999px;padding:10px 22px;font:inherit;font-size:26px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity 1s}
#env.on{opacity:1;pointer-events:auto;animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,214,140,.5)}50%{box-shadow:0 0 18px 6px rgba(255,214,140,.45)}}
#zoom,#note{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,4,20,.86);opacity:0;pointer-events:none;transition:opacity .45s}
#zoom{z-index:8}#note{z-index:7}
#zoom.on,#note.on{opacity:1;pointer-events:auto}
.zin{width:min(80vw,calc(56vh / 1.12));text-align:center;transform:scale(.9) rotate(-1.5deg);transition:transform .5s cubic-bezier(.2,.9,.3,1)}
#zoom.on .zin{transform:scale(1) rotate(-1.5deg)}
#zcap{margin:20px 4px 0;font-size:clamp(26px,6vw,34px);line-height:1.4;color:var(--text);opacity:0;text-shadow:0 0 10px rgba(10,4,30,.9)}
#zoom.on #zcap{animation:rise .8s .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.paper{width:min(88vw,460px);max-height:78vh;overflow:auto;padding:30px 26px 20px;border-radius:6px;background:linear-gradient(#fff8ef,#ffeef2);color:#5b2b3f;box-shadow:0 10px 40px rgba(0,0,0,.5),0 0 30px rgba(255,200,140,.3);font-size:clamp(24px,5.6vw,30px);line-height:1.55}
.paper p{margin:0 0 .8em;opacity:0}
#note.on .paper p{animation:rise .9s ease both;animation-delay:calc(var(--n) * 1.2s + .4s)}
.paper .to{font-size:1.15em;font-weight:700}.paper .sign{text-align:right}
#nclose{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:16px;border:1px solid rgba(255,230,238,.5);background:rgba(255,255,255,.08);color:var(--text);border-radius:999px;padding:6px 14px;font:inherit;font-size:20px;cursor:pointer}
.bp{position:fixed;z-index:9;pointer-events:none;font-size:var(--fs);color:var(--c);transform:translate(-50%,-50%);text-shadow:0 0 8px currentColor;animation:bp .9s ease-out forwards}
@keyframes bp{from{opacity:1;transform:translate(-50%,-50%) scale(.4)}to{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.1)}}
.tw{animation:twk 3s ease-in-out infinite alternate}
@keyframes twk{from{opacity:.25}to{opacity:1}}
#canopy{transform-box:view-box;transform-origin:170px 165px;animation:sway2 6s ease-in-out infinite alternate}
@keyframes sway2{from{transform:rotate(-1.4deg)}to{transform:rotate(1.4deg)}}
.fh{transform-box:fill-box;transform-origin:center;opacity:0;animation:fh 4s ease-in infinite}
@keyframes fh{0%{transform:translateY(0) scale(.6);opacity:0}25%{opacity:1}100%{transform:translateY(-38px) scale(1.1);opacity:0}}
#ending{position:fixed;inset:0;z-index:8;background:radial-gradient(100% 70% at 50% 100%,rgba(122,47,120,.55),rgba(5,2,14,.94) 70%);opacity:0;pointer-events:none;transition:opacity .8s}
#ending.on{opacity:1;pointer-events:auto}
#fw{position:absolute;inset:0;width:100%;height:100%}
#endtxt{position:absolute;left:0;right:0;top:40%;text-align:center;pointer-events:none;color:var(--text);text-shadow:0 0 18px rgba(255,160,200,.8);opacity:0}
#ending.on #endtxt{animation:rise 1.8s 1.2s ease both}
#endtxt .big{font-size:clamp(44px,12vw,76px);line-height:1.2}#endtxt .sm{font-size:clamp(26px,6.5vw,38px);margin-top:10px}
#endbtns{position:absolute;left:0;right:0;bottom:calc(28px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;justify-content:center}
#endbtns button{border:1px solid rgba(255,230,238,.5);background:rgba(255,255,255,.08);color:var(--text);border-radius:999px;padding:8px 18px;font:inherit;font-size:22px;cursor:pointer}
#fwBtn{display:block;margin:14px auto 6px;border:1px solid #d98aa8;background:transparent;color:#8a3b5c;border-radius:999px;padding:8px 20px;font:inherit;font-size:24px;cursor:pointer;opacity:0;pointer-events:none}
#note.on #fwBtn{animation:riseb .9s 8.8s ease both}
@keyframes riseb{from{opacity:0;pointer-events:none;transform:translateY(8px)}to{opacity:1;pointer-events:auto;transform:none}}
@media (min-width:900px){#wall{-webkit-backdrop-filter:none;backdrop-filter:none;background:radial-gradient(90% 70% at 50% 40%,rgba(255,196,120,.22),rgba(30,14,40,0) 70%),rgba(24,10,34,.9)}}
@media (pointer:fine){.tw{animation:none}}
</style>
</head>

// 만년필로 쓰듯 한 글자씩 나타나는 문구
function write(msg){
  letter.className = ''; letter.textContent = '';
  let i = 0;
  msg.split(' ').forEach((w, wi, arr) => {
    const ws = document.createElement('span'); ws.className = 'w';
    [...w].forEach(ch => { const c = document.createElement('span'); c.className = 'c'; c.textContent = ch; c.style.setProperty('--i', i++); ws.appendChild(c); });
    letter.appendChild(ws);
    if (wi < arr.length - 1){ letter.appendChild(document.createTextNode(' ')); i++; }
  });
  hideT = setTimeout(() => { letter.className = 'out'; }, i*110 + 500 + 2400);
}

const WALL_MSG = '우리가 함께한 모든 순간이 별처럼 빛나고 있어';
const wall = document.getElementById('wall'), wallItems = document.getElementById('wallItems'), strings = document.getElementById('strings');
const SVGNS = 'http://www.w3.org/2000/svg';
let wallOn = false;
function layoutWall(){
  const w = innerWidth, h = innerHeight, rows = 3, total = WALL.length || 9, counts = [0, 1, 2].map(q => Math.floor(total / 3) + (q < total % 3 ? 1 : 0)), pw = Math.min(w * .27, h * .15, 170);
  strings.setAttribute('width', w); strings.setAttribute('height', h);
  strings.innerHTML = ''; wallItems.innerHTML = '';
  let k = 0;
  for (let r = 0; r < rows; r++){
    const y0 = h * (.15 + r * .24) + (r % 2 ? 12 : 0), sag = h * .035;
    const P = t => [-10 + (w + 20) * t, y0 + 4 * sag * t * (1 - t)];
    const path = document.createElementNS(SVGNS, 'path');
    path.setAttribute('d', `M -10,${y0} Q ${w / 2},${y0 + 2 * sag} ${w + 10},${y0}`);
    path.setAttribute('fill', 'none'); path.setAttribute('stroke', 'rgba(255,230,180,.6)'); path.setAttribute('stroke-width', '1.2');
    strings.appendChild(path);
    const nb = Math.round((w + 20) / 26);
    for (let i = 0; i <= nb; i++){
      const [x, y] = P(i / nb), b = document.createElement('i');
      b.className = 'bulb'; b.style.cssText = `left:${x}px;top:${y}px;animation-delay:-${(Math.random() * 2.6).toFixed(2)}s`;
      wallItems.appendChild(b);
    }
    const per = counts[r];
    for (let j = 0; j < per; j++, k++){
      const [x, y] = P((j + .5) / per), rot = ((k * 37) % 11 - 5) * 1.1;
      const el = document.createElement('div'); el.className = 'pic'; el.dataset.i = k;
      el.style.cssText = `left:${x}px;top:${y + 4}px;width:${pw}px;--d:${(r * .35 + j * .18 + .2).toFixed(2)}s`;
      el.innerHTML = `<div class='in' style='--r:${rot}deg'><div class='frm'><div class='img'></div></div></div>`;
      const im = el.querySelector('.img');
      if (WALL[k]) im.style.backgroundImage = `url(${WALL[k]})`;
      else { im.style.backgroundImage = `linear-gradient(135deg,hsl(${(k * 47 + 330) % 360},75%,82%),hsl(${(k * 47 + 20) % 360},70%,72%))`; im.textContent = '사진 ' + (k + 1); }
      wallItems.appendChild(el);
    }
  }
}
function showWall(){
  wallOn = true; clearTimeout(hideT); clearTimeout(showT);
  letter.className = 'out';
  layoutWall();
  showT = setTimeout(() => { wall.classList.add('on'); hideT = setTimeout(() => write(WALL_MSG), 1500); envT = setTimeout(() => env.classList.add('on'), 9000); }, 700);
}
function hideWall(){
  wallOn = false; wall.classList.remove('on'); env.classList.remove('on'); clearTimeout(envT); clearTimeout(hideT); clearTimeout(showT);
  letter.className = 'out'; idx = 0; spin += Math.PI * 2; kick = 1;

}

// 오르골 배경음 (WebAudio로 직접 합성한 잔잔한 멜로디, 첫 터치에 시작)
const SEQ = [72,76,79,76, 74,77,81,77, 72,76,79,84, 83,79,76,79, 69,72,76,72, 67,71,74,71, 65,69,72,77, 76,72,67,72];
let ac, master, musicTimer, mstep = 0, musicOn = true, armed = false, envT;
function note1(){
  const m = SEQ[mstep++ % SEQ.length], f = 440 * Math.pow(2, (m - 69) / 12), t = ac.currentTime;
  [[1, 1], [2, .25], [3.01, .08]].forEach(([k, v]) => {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine'; o.frequency.value = f * k;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v * .5, t + .005); g.gain.exponentialRampToValueAtTime(.001, t + 1.6);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + 1.7);
  });
}
function startMusic(){
  try {
    if (!ac){ ac = new (window.AudioContext || window.webkitAudioContext)(); master = ac.createGain(); master.gain.value = .2; master.connect(ac.destination); }
    if (ac.state === 'suspended') ac.resume();
    clearInterval(musicTimer); musicTimer = setInterval(note1, 480);
  } catch (err) {}
}
const mute = document.getElementById('mute');
mute.addEventListener('click', () => {
  musicOn = !musicOn; mute.textContent = musicOn ? '🔊' : '🔇';
  if (musicOn && armed) startMusic(); else clearInterval(musicTimer);
});

function burst(x, y){
  const sym = ['♥', '♥', '✦', '♡', '✧'], col = ['#ff6f9b', '#ff9ebb', '#ffd6e4', '#ffe9a8', '#ffffff'];
  for (let i = 0; i < 12; i++){
    const a = Math.PI * 2 * i / 12 + Math.random() * .5, d = 50 + Math.random() * 70, el = document.createElement('i');
    el.className = 'bp'; el.textContent = sym[i % 5];
    el.style.cssText = `left:${x}px;top:${y}px;--dx:${Math.cos(a) * d}px;--dy:${Math.sin(a) * d - 20}px;--fs:${14 + Math.random() * 14}px;--c:${col[i % 5]}`;
    document.body.appendChild(el); setTimeout(() => el.remove(), 950);
  }
}
addEventListener('pointerdown', e => {
  if (e.target.closest && e.target.closest('button')) return;
  burst(e.clientX, e.clientY);
  if (navigator.vibrate) navigator.vibrate(18);
});

const ending = document.getElementById('ending'), fw = document.getElementById('fw'), fx = fw.getContext('2d');

const PAL = [330, 345, 40, 280, 200, 20];
function explode(x, y, heart){
  const hue = PAL[Math.floor(Math.random() * PAL.length)], n = heart ? 70 : 80;
  for (let i = 0; i < n; i++){
    let vx, vy;
    if (heart){ const t = i / n * Math.PI * 2; vx = 16 * Math.pow(Math.sin(t), 3) * .2; vy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * .2; }
    else { const a = Math.random() * 6.283, s = 1 + Math.random() * 4.2; vx = Math.cos(a) * s; vy = Math.sin(a) * s; }
    parts.push({x, y, vx, vy, life: 1, d: .010 + Math.random() * .012, g: heart ? .012 : .045, c: `hsl(${hue + Math.random() * 20},95%,${heart ? 72 : 62}%)`});
  }
}
function fwLoop(ts){
  if (!fwOn) return;
  const w = innerWidth, h = innerHeight;
  fx.globalCompositeOperation = 'destination-out'; fx.fillStyle = 'rgba(0,0,0,.2)'; fx.fillRect(0, 0, w, h);
  fx.globalCompositeOperation = 'lighter';
  if (ts > nextShot){ parts.push({x: w * (.15 + Math.random() * .7), y: h, vx: 0, vy: -7.5, rocket: true, ty: h * (.18 + Math.random() * .3), life: 1, heart: Math.random() < .35, c: '#ffe9c8'}); nextShot = ts + 600 + Math.random() * 800; }
  const next = [];
  for (const p of parts){
    p.x += p.vx; p.y += p.vy;
    if (p.rocket){ if (p.y <= p.ty){ explode(p.x, p.y, p.heart); continue; } }
    else { p.vy += p.g; p.vx *= .985; p.vy *= .985; p.life -= p.d; if (p.life <= 0) continue; }
    fx.globalAlpha = Math.max(p.life, 0); fx.fillStyle = p.c; fx.beginPath(); fx.arc(p.x, p.y, p.rocket ? 2.2 : 1.8, 0, 6.283); fx.fill();
    next.push(p);
  }
  parts = next; fx.globalAlpha = 1;
  requestAnimationFrame(fwLoop);
}
function openEnding(){
  const dpr = innerWidth > 900 ? 1 : Math.min(devicePixelRatio || 1, 2);
  fw.width = innerWidth * dpr; fw.height = innerHeight * dpr; fx.setTransform(dpr, 0, 0, dpr, 0, 0);
  parts = []; nextShot = 0; fwOn = true; ending.classList.add('on'); requestAnimationFrame(fwLoop);
}
function closeEnding(){ fwOn = false; ending.classList.remove('on'); noteEl.classList.remove('on'); }
document.getElementById('paper').addEventListener('click', e => { if (e.target.id === 'fwBtn') openEnding(); });
fw.addEventListener('pointerdown', e => explode(e.clientX, e.clientY, Math.random() < .4));
document.getElementById('endBack').addEventListener('click', closeEnding);
document.getElementById('endAgain').addEventListener('click', () => { closeEnding(); hideWall(); });

function tap(e){
  if (e && e.target && e.target.id === 'mute') return;
  if (!armed){ armed = true; if (musicOn) startMusic(); }
  if (wallOn){ if (e && e.target && e.target.id === 'again') hideWall(); return; }
  if (first){ first = false; hint.style.opacity = 0; } else { if (idx === N - 1){ showWall(); return; } idx++; }
  spin += Math.PI * 2; kick = 1;
  setTimeout(() => { photoMat.map = tex[idx]; photoMat.needsUpdate = true; }, 260);
  clearTimeout(hideT); clearTimeout(showT);
  letter.className = 'out';
  showT = setTimeout(() => write(MSG[idx % MSG.length]), 500);
}
addEventListener('pointerdown', tap);

function resize(){
  const w = innerWidth, h = innerHeight;
  R.setPixelRatio(Math.min(devicePixelRatio, w > 900 ? 1.25 : 2)); R.setSize(w, h); C.aspect = w/h;
  C.position.set(0, -0.4, w/h < .8 ? 11.5 : 8.5);
  C.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

const clock = new THREE.Clock(); let fa = 0;
(function loop(){
  requestAnimationFrame(loop);
  fa += clock.getDelta(); if (fa < .0155) return;
  const dt = Math.min(fa, .05), t = clock.elapsedTime; fa = 0;
  spinCur += (spin - spinCur) * .07;
  card.rotation.y = spinCur + Math.sin(t*.8) * .25;
  card.rotation.x = Math.sin(t*.6) * .06;
  card.position.y = .5 + Math.sin(t*1.1) * .12;
  kick *= .94;
  hearts.forEach(h => {
    const d = h.userData;
    d.y += (d.v + kick*1.6) * dt * 2;
    if (d.y > 5.5) d.y = -5.5;
    h.position.set(d.x + Math.sin(t*.7 + d.p) * .4, d.y, d.z);
    h.rotation.y += dt * (.6 + d.v);
    h.rotation.z = Math.sin(t + d.p) * .25;
    h.scale.setScalar(d.s * (1 + kick*.35));
  });
  nextMeteor -= dt;
  if (nextMeteor <= 0){ launch(); nextMeteor = 3 + Math.random() * 4; }
  meteors.forEach(m => {
    if (!m.visible) return;
    const d = m.userData; d.life += dt / d.dur;
    if (d.life >= 1){ m.visible = false; m.material.opacity = 0; return; }
    m.position.x += d.v.x * dt; m.position.y += d.v.y * dt;
    m.material.opacity = Math.sin(d.life * Math.PI);
  });
  layers.forEach((l, i) => {
    l.material.opacity = l.userData.op * (.55 + .45 * Math.sin(t * (1.2 + i*.5) + l.userData.p));
    l.position.y = Math.sin(t * .15 + i) * .6;
    l.rotation.z = Math.sin(t * .1 + i) * .08;
  });
  halo.material.opacity = .42 + .1 * Math.sin(t * 1.2) + kick * .3;
  R.render(S, C);
})();
</script>
</body>
